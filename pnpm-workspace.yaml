# pnpm 11 refuses to install when a dependency's build script is neither approved nor declined, and
# no longer reads the `pnpm` field in package.json. These are exactly the scripts that ran under the
# pnpm 9 builds this image used before, so the produced install is unchanged.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - drawesome@0.1.0

# Excalidraw's diagram parser still asks for the pre-patch range, but the
# patched release is API compatible and removes the avoidable audit finding.
overrides:
  lodash-es: 4.18.1
