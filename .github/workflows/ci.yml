name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mah_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:56379
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/mah_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Keep the check present on every PR; workflow-level path filters can leave
      # a required check pending. Only known documentation paths may skip code checks.
      - name: Determine verification scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          code=true
          judging=false
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}"; then
            range="$BASE..HEAD"
            if [[ "$EVENT" == pull_request ]]; then range="$BASE...HEAD"; fi
            git diff --name-only --no-renames -z "$range" > "$RUNNER_TEMP/ci-paths"
            code=false
            while IFS= read -r -d '' file; do
              case "$file" in
                README.md|AGENTS.md|docs/*.md|.cursor/rules/*.mdc) ;;
                *) code=true ;;
              esac
              case "$file" in runtime-assets/hot-and-cold/*) judging=true ;; esac
            done < "$RUNNER_TEMP/ci-paths"
            git diff --check "$range"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "judging=$judging" >> "$GITHUB_OUTPUT"
          if [[ "$code" == false ]]; then
            echo 'Documentation-only change: code verification is not needed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check source
        if: steps.scope.outputs.code == 'true'
        run: pnpm check
      - name: Check changed game judging assets
        if: steps.scope.outputs.judging == 'true'
        run: pnpm check:game-judging --base "$GAME_JUDGING_BASE"
        env:
          GAME_JUDGING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Install media test tools
        if: steps.scope.outputs.code == 'true'
        run: |
          if ! command -v ffmpeg || ! command -v exiftool; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
          fi
      - name: Test
        if: steps.scope.outputs.code == 'true'
        run: pnpm test
      - name: Build
        if: steps.scope.outputs.code == 'true'
        run: pnpm build
      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser journeys
        id: browser
        if: steps.scope.outputs.code == 'true'
        run: pnpm test:e2e --max-failures=1 --global-timeout=1200000
      - name: Save browser failure evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
